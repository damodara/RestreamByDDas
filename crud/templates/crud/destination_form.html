{% extends "crud/base.html" %}

{% block title %}Destination — {{ stream.name }}{% endblock %}

{% block content %}
	<h1>Destination для «{{ stream.name }}»</h1>
	<div class="card">
		<form method="post">
			{% csrf_token %}
			{{ form.as_p }}
			<button type="submit">Сохранить</button>
		</form>
	</div>
	<p><a href="{% url 'crud:stream_detail' stream.id %}">← Назад к точке приёма</a></p>
{% endblock %}
