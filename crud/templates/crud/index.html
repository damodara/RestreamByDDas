<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Мои точки приёма</title>
</head>
<body>
	<h1>Мои точки приёма</h1>
	<p><a href="{% url 'crud:stream_create' %}">Создать точку приёма</a></p>
	{% if streams %}
		<ul>
			{% for stream in streams %}
				<li>
					<a href="{% url 'crud:stream_detail' stream.id %}">{{ stream.name }}</a>
				</li>
			{% endfor %}
		</ul>
	{% else %}
		<p>Точек приёма пока нет.</p>
	{% endif %}
</body>
</html>
