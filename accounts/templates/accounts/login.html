{% extends "crud/base.html" %}

{% block title %}Вход — RestreamByDDas{% endblock %}

{% block content %}
	<h1>Вход</h1>
	<div class="card">
		<form method="post">
			{% csrf_token %}
			{{ form.as_p }}
			<button type="submit">Войти</button>
		</form>
	</div>
	<p><a href="{% url 'accounts:register' %}">Ещё нет аккаунта? Зарегистрироваться</a></p>
	<p><a href="{% url 'accounts:password_reset' %}">Забыли пароль?</a></p>
{% endblock %}
