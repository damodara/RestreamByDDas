{% extends "crud/base.html" %}

{% block title %}Восстановление пароля — RestreamByDDas{% endblock %}

{% block content %}
	<h1>Восстановление пароля</h1>
	<div class="card">
		<p>Укажите email, указанный при регистрации — на него придёт ссылка для сброса пароля.</p>
		<form method="post">
			{% csrf_token %}
			{{ form.as_p }}
			<button type="submit">Отправить ссылку</button>
		</form>
	</div>
	<p><a href="{% url 'accounts:login' %}">← Назад ко входу</a></p>
{% endblock %}
